---
- name: Install k3s Server (Master Node)
  hosts: k3s_server
  become: yes
  tasks:
    - name: Download and install k3s server
      shell: curl -sfL https://get.k3s.io | sh -s - --write-kubeconfig-mode 644 --node-ip 192.168.174.101
      args:
        creates: /usr/local/bin/k3s

    - name: Wait for node-token to be generated
      wait_for:
        path: /var/lib/rancher/k3s/server/node-token
        timeout: 60

    - name: Read k3s node-token
      slurp:
        src: /var/lib/rancher/k3s/server/node-token
      register: k3s_token_raw

    - name: Save token fact
      set_fact:
        k3s_token: "{{ k3s_token_raw.content | b64decode | trim }}"

- name: Install k3s Agent (Worker Node)
  hosts: k3s_agent
  become: yes
  tasks:
    - name: Download and install k3s agent and join cluster
      shell: >
        curl -sfL https://get.k3s.io |
        K3S_URL=https://192.168.174.101:6443
        K3S_TOKEN={{ hostvars['k3s-server']['k3s_token'] }}
        sh -s - --node-ip 192.168.174.102
      args:
        creates: /usr/local/bin/k3s-agent-uninstall.sh

- name: Verify k3s Cluster Status
  hosts: k3s_server
  become: yes
  tasks:
    - name: Wait for all nodes to be Ready
      shell: kubectl get nodes
      register: nodes_output
      until: "'NotReady' not in nodes_output.stdout and 'k3s-agent' in nodes_output.stdout"
      retries: 12
      delay: 5

    - name: Display cluster nodes
      debug:
        var: nodes_output.stdout_lines
