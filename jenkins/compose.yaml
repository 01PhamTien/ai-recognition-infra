name: devvl-jenkins

services:
  jenkins:
    build:
      context: ..
      dockerfile: jenkins/Dockerfile
    image: devvl/jenkins:lts-jdk21-docker
    container_name: jenkins
    restart: unless-stopped
    group_add:
      - "${DOCKER_GID:-0}"
    ports:
      - "8080:8080"
    volumes:
      - jenkins_home:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock

volumes:
  jenkins_home:
    external: true
    name: jenkins_home
