apiVersion: v1
data:
  config.alloy: |
    local.file_match "app_logs" {
      path_targets = [
        {
          __path__ = "/var/log/pods/ai-recognition-staging_api-*/api/*.log",
          service  = "api",
          namespace = "ai-recognition-staging",
        },
        {
          __path__ = "/var/log/pods/ai-recognition-staging_worker-*/worker/*.log",
          service  = "worker",
          namespace = "ai-recognition-staging",
        },
      ]
    }

    loki.source.file "app_logs" {
      targets    = local.file_match.app_logs.targets
      forward_to = [loki.process.app_logs.receiver]
    }

    loki.process "app_logs" {
      stage.cri {}

      stage.json {
        expressions = {
          level      = "level",
          service    = "service",
          request_id = "request_id",
        }
      }

      stage.labels {
        values = {
          level   = "",
          service = "",
        }
      }

      forward_to = [loki.write.local.receiver]
    }

    loki.write "local" {
      endpoint {
        url = "http://127.0.0.1:13100/loki/api/v1/push"
      }
    }
kind: ConfigMap
metadata:
  name: alloy-logs-config
  namespace: ai-recognition-staging
