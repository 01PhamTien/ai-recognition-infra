
global:
  resolve_timeout: 5m

route:
  receiver: telegram-receiver
  group_by:
    - alertname
    - instance
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h

receivers:
  - name: telegram-receiver
    telegram_configs:
      - bot_token_file: /run/secrets/telegram_bot_token
        chat_id: 8076507059
        send_resolved: true
