apiVersion: v1
kind: ServiceAccount
metadata:
  name: backend-prometheus
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: backend-prometheus
rules:
  - apiGroups: [""]
    resources: [pods]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: backend-prometheus
subjects:
  - kind: ServiceAccount
    name: backend-prometheus
    namespace: ai-recognition-staging
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: backend-prometheus
