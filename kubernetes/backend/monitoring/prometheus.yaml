# Prometheus tối thiểu để nghiệm thu backend; TSDB emptyDir, không thay stack TV5.
apiVersion: v1
kind: Service
metadata:
  name: backend-prometheus
spec:
  selector:
    app.kubernetes.io/name: backend-prometheus
  ports:
    - name: http
      port: 9090
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend-prometheus
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: backend-prometheus
  template:
    metadata:
      labels:
        app.kubernetes.io/name: backend-prometheus
    spec:
      serviceAccountName: backend-prometheus
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        fsGroup: 65534
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: prometheus
          image: prom/prometheus:v3.5.0
          args:
            - --config.file=/etc/prometheus/prometheus.yml
            - --storage.tsdb.path=/prometheus
            - --storage.tsdb.retention.time=6h
            - --storage.tsdb.retention.size=512MB
          ports:
            - name: http
              containerPort: 9090
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 512Mi
          startupProbe:
            httpGet:
              path: /-/ready
              port: http
            periodSeconds: 5
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /-/healthy
              port: http
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /-/ready
              port: http
            periodSeconds: 5
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: config
              mountPath: /etc/prometheus
              readOnly: true
            - name: data
              mountPath: /prometheus
      volumes:
        - name: config
          configMap:
            name: backend-prometheus-config
        - name: data
          emptyDir:
            sizeLimit: 1Gi
