apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
  labels:
    app.kubernetes.io/name: worker
    app.kubernetes.io/part-of: ai-recognition
    backend.ai-recognition/phase: workload
spec:
  replicas: 1
  revisionHistoryLimit: 3
  progressDeadlineSeconds: 900
  # Tránh hai Pod cùng dùng local-path trong lúc cập nhật; có gián đoạn khi rollout.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: worker
      app.kubernetes.io/part-of: ai-recognition
  template:
    metadata:
      labels:
        app.kubernetes.io/name: worker
        app.kubernetes.io/part-of: ai-recognition
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: /metrics
        prometheus.io/port: "8001"
    spec:
      serviceAccountName: backend-runtime
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 330
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: model-init
          image: ghcr.io/01phamtien/ai-recognition-worker:CHON_TAG_GHCR
          imagePullPolicy: IfNotPresent
          command: [python, scripts/download_model.py, --directory, /app/model-assets]
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: model
              mountPath: /app/model-assets
            - name: tmp
              mountPath: /tmp
      containers:
        - name: worker
          image: ghcr.io/01phamtien/ai-recognition-worker:CHON_TAG_GHCR
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8001
          envFrom:
            - configMapRef:
                name: backend-config
            - secretRef:
                name: backend-secrets
          resources:
            requests:
              cpu: 500m
              memory: 512Mi
            limits:
              cpu: "2"
              memory: 1536Mi
          startupProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 120
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            periodSeconds: 10
            timeoutSeconds: 15
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: uploads
              mountPath: /app/data/uploads
            - name: tmp
              mountPath: /tmp
            - name: model
              mountPath: /app/model-assets
              readOnly: true
      volumes:
        - name: uploads
          persistentVolumeClaim:
            claimName: backend-uploads
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
        - name: model
          emptyDir:
            sizeLimit: 64Mi
