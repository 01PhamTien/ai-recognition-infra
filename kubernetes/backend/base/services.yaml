apiVersion: v1
kind: Service
metadata:
  name: api
  labels:
    app.kubernetes.io/name: api
    app.kubernetes.io/part-of: ai-recognition
    backend.ai-recognition/phase: workload
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: api
    app.kubernetes.io/part-of: ai-recognition
  ports:
    - name: http
      port: 8000
      targetPort: http
---
apiVersion: v1
kind: Service
metadata:
  name: worker
  labels:
    app.kubernetes.io/name: worker
    app.kubernetes.io/part-of: ai-recognition
    backend.ai-recognition/phase: workload
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: worker
    app.kubernetes.io/part-of: ai-recognition
  ports:
    - name: http
      port: 8001
      targetPort: http
