apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: ai-recognition-staging
resources:
  - ../../base
  - namespace.yaml
patches:
  - path: local-storage.yaml
  - target:
      group: apps
      version: v1
      kind: Deployment
    patch: |-
      - op: add
        path: /spec/template/spec/nodeSelector
        value:
          ai-recognition/upload-node: "true"
